databases:
  - name: geosentry-db
    databaseName: landslide_db
    user: landslide
    plan: free

envVarGroups:
  - name: geosentry-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        fromDatabase:
          name: geosentry-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: geosentry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: geosentry-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: geosentry-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: geosentry-redis
          property: connectionString
      - key: MODEL_PATH
        value: app/ml/model.pkl
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_ENDPOINT_URL
        sync: false

services:
  - type: redis
    name: geosentry-redis
    plan: free
    ipAllowList: []

  - type: web
    name: geosentry-landslide-intelligence
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: geosentry-shared
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000

  - type: worker
    name: geosentry-worker-risk
    env: python
    plan: free
    buildCommand: pip install -r requirements-dev.txt
    startCommand: celery -A app.tasks.celery_app worker -Q risk -c 4 --loglevel=info
    envVars:
      - fromGroup: geosentry-shared
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: worker
    name: geosentry-worker-alerts
    env: python
    plan: free
    buildCommand: pip install -r requirements-dev.txt
    startCommand: celery -A app.tasks.celery_app worker -Q alerts -c 2 --loglevel=info
    envVars:
      - fromGroup: geosentry-shared
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: worker
    name: geosentry-scheduler
    env: python
    plan: free
    buildCommand: pip install -r requirements-dev.txt
    startCommand: celery -A app.tasks.celery_app beat --loglevel=info
    envVars:
      - fromGroup: geosentry-shared
      - key: PYTHON_VERSION
        value: 3.12.0
